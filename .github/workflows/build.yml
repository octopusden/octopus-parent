name: Maven Compile & UT

# Pull requests run this through merge-gate.yml, not on their own.
on:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

jobs:
  run-build-and-deploy:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-build.yml@v3.0.3
    with:
      java-version: '11'
      # -Pit runs the gate-contract fixtures in src/it: each asserts a behaviour the README promises,
      # and each encodes a defect that actually shipped during review. They need a JDK 11+ runtime,
      # which this job has.
      mvn-parameters: -Pit
