name: Maven Release

on:
  workflow_dispatch:
    inputs:
      increment-version-level:
        description: >-
          Semver level to bump the latest tag by. `patch` is the default for a routine release;
          pick `minor` when the release adds functionality, as 2.1.0 does with the quality gates.
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        description: Run the release flow without publishing or creating a release
        required: false
        type: boolean
        default: false

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@v3.0.3
    with:
      java-version: '11'
      flow-type: public
      increment-version-level: ${{ inputs.increment-version-level }}
      dry-run: ${{ inputs.dry-run }}
      # Registration lives in the release job:
      # exact version from the build output, gated on !dry-run. Replaces check-and-register.yml. See octopus-base#236.
      register-release-immediately: true
    secrets: inherit
