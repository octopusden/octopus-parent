name: Maven Release

on:
  workflow_dispatch:
    inputs:
      increment-version-level:
        description: >-
          Semver level to bump the latest tag by. `patch` is the default for a routine release;
          pick `minor` when the release adds functionality, as 2.1.0 does with the quality gates.
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        description: Run the release flow without publishing or creating a release
        required: false
        type: boolean
        default: false

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@v3.0.3
    with:
      java-version: '11'
      flow-type: public
      increment-version-level: ${{ inputs.increment-version-level }}
      dry-run: ${{ inputs.dry-run }}
      # Register from inside the release, not from a workflow_run listener. The registering job
      # takes the version from prepare-build-publish-release's output, runs only when
      # !inputs.dry-run, and needs tag-and-release to have succeeded - so there is no version to
      # resolve and no fallback to resolve it wrongly. Artifact availability is already established
      # upstream: tag-and-release runs after finish-publication, which waits for PUBLISHED and
      # verifies the artifacts resolve on Central.
      register-release-immediately: true
    secrets: inherit
