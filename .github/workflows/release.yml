name: Maven Release

on:
  workflow_dispatch:
    inputs:
      increment-version-level:
        description: >-
          Semver level to bump the latest tag by. `patch` is the default for a routine release;
          pick `minor` when the release adds functionality, as 2.1.0 does with the quality gates.
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        description: Run the release flow without publishing or creating a release
        required: false
        type: boolean
        default: false

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@v3.0.2
    with:
      java-version: '11'
      flow-type: public
      increment-version-level: ${{ inputs.increment-version-level }}
      dry-run: ${{ inputs.dry-run }}
      # -DautoPublish=true, although pom.xml already sets it and the effective POM shows it applied:
      # both 2.1.0 and 2.2.0 still stopped at "validated" and waited for a click in the portal. The
      # descriptor for central-publishing-maven-plugin 0.8.0 exposes the user property `autoPublish`,
      # and a -D value wins over configuration, so this forces the automatic publishing type whatever
      # is swallowing the POM setting. See #11.
      release-mvn-parameters: -DautoPublish=true
    secrets: inherit
